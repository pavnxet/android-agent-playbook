name: Verify Starter

# Proves the playbook's baseline stack actually compiles and tests green.
on:
  push:
    paths:
      - 'starter/**'
      - '.github/workflows/verify-starter.yml'
  pull_request:
    paths:
      - 'starter/**'
      - '.github/workflows/verify-starter.yml'
  workflow_dispatch:

concurrency:
  group: verify-starter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: testDebugUnitTest + assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: starter-test-reports
          path: |
            starter/app/build/reports/tests/**
            starter/app/build/test-results/**
          if-no-files-found: ignore
