# 16 GB RAM laptop profile (playbook Part 6.3): the heap grows on demand,
# only the ceiling matters, and the Kotlin daemon is capped separately.
org.gradle.jvmargs=-Xmx3g -Xms512m -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

android.useAndroidX=true
kotlin.code.style=official
